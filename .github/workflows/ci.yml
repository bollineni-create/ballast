name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the self-update check reads earlier builds

jobs:
  mac-app:
    # Builds the self-contained Mac app and publishes Ballast.dmg as a run artifact
    # (only people with access to this repository can download it).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: zsh -n app/macos/install.sh && zsh -n app/macos/build.sh
      - name: Build Ballast.app and Ballast.dmg
        run: zsh app/macos/build.sh --package
      - name: Check the bundle
        run: |
          plutil -lint build/Ballast.app/Contents/Info.plist
          lipo -archs build/Ballast.app/Contents/MacOS/Ballast
          lipo -archs build/Ballast.app/Contents/Resources/node
          codesign --verify --deep build/Ballast.app
      - name: Open the app and check its server answers
        run: |
          open -n build/Ballast.app
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5179/api/status && break; sleep 1; done
          curl -sf http://127.0.0.1:5179/ | grep -q "<title>Ballast</title>"
          test -d "$HOME/Library/Application Support/Ballast"
          cat "$HOME/Library/Logs/Ballast.log"
          osascript -e 'quit app "Ballast"' || pkill -x Ballast || true
          sleep 3
      - name: Check self-update (it should replace itself with the newest earlier build)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(curl -fsSL -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
            | python3 -c "import sys,json; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['head_sha'] if r else '')")
          if [ -z "$latest" ] || [ "$latest" = "$GITHUB_SHA" ]; then echo "No other build to update to; skipping"; exit 0; fi
          ditto build/Ballast.app /Applications/Ballast.app
          D="$HOME/Library/Application Support/Ballast"
          mkdir -p "$D"
          printf 'BALLAST_UPDATE_TOKEN=%s\n' "$TOKEN" > "$D/.env"
          chmod 600 "$D/.env"
          open /Applications/Ballast.app
          sha() { /usr/libexec/PlistBuddy -c "Print :BallastBuildSHA" /Applications/Ballast.app/Contents/Info.plist 2>/dev/null || echo none; }
          for i in $(seq 1 150); do [ -d /Applications/Ballast.app ] && [ "$(sha)" != "$GITHUB_SHA" ] && break; sleep 2; done
          echo "Installed build: $(sha) (expected $latest, or none for builds before self-update)"
          [ "$(sha)" = "$latest" ] || [ "$(sha)" = none ]
          codesign --verify --deep /Applications/Ballast.app
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5179/api/status && break; sleep 1; done
          curl -sf http://127.0.0.1:5179/api/status
          osascript -e 'quit app "Ballast"' || true
          rm -f "$D/.env"
      - uses: actions/upload-artifact@v4
        with:
          name: Ballast-mac
          path: build/Ballast.dmg
          retention-days: 90

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Server starts and serves the app
        run: |
          PORT=5179 node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5179/api/status && break; sleep 1; done
          curl -sf http://127.0.0.1:5179/ | grep -q "<title>Ballast</title>"
          curl -sf http://127.0.0.1:5179/lib/coinbase.js > /dev/null
          cat server.log
